[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ThinkBayes2"
version = "2.0.0"
description = "Supporting code for the book Think Bayes 2e"
readme = "README.md"
license = {text = "CC BY-NC-SA 4.0"}
authors = [
    {name = "Allen B. Downey", email = "downey@allendowney.com"}
]
maintainers = [
    {name = "Allen B. Downey", email = "downey@allendowney.com"}
]
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Education",
]
keywords = ["bayesian", "statistics", "probability", "data analysis"]

dependencies = [
    "sympy>=1.13",
    "numpy>=2.1.0",
    "pandas>=2.2.0",
    "scipy>=1.14.0",
    "matplotlib>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "nbmake>=1.5.0",
    "jupyter>=1.1.0",
    "ipykernel>=6.29.0",
]
notebooks = [
    "jupyter>=1.1.0",
    "ipykernel>=6.29.0",
    "seaborn>=0.13.0",
    "statsmodels>=0.14.0",
    "arviz>=0.19.0",
    "pymc>=5.16.0",
    "graphviz>=0.20.0",
    "lxml>=5.3.0",
    "xlrd>=2.0.0",
    "html5lib>=1.1",
    "tables>=3.9.0",
    "nbconvert>=7.16.0",
    "empiricaldist>=0.6.7",
]
all = [
    "ThinkBayes2[dev,notebooks]",
]

[project.urls]
Homepage = "https://github.com/AllenDowney/ThinkBayes2"
Documentation = "http://allendowney.github.io/ThinkBayes2"
Repository = "https://github.com/AllenDowney/ThinkBayes2"
"Bug Tracker" = "https://github.com/AllenDowney/ThinkBayes2/issues"

[tool.hatch.build.targets.wheel]
packages = ["thinkbayes"]

[tool.hatch.build]
include = [
    "src/think-bayes/thinkbayes/**",
]
sources = ["src/think-bayes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py313"
line-length = 88
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.black]
target-version = ['py313']
line-length = 88
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''
